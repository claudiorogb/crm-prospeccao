name: Apply V83 terminal visibility

on:
  push:
    paths:
      - 'scripts/apply_v83_terminal_visibility_and_closed.py'
      - '.github/workflows/apply-v83-terminal-visibility.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V83 patch
        run: python scripts/apply_v83_terminal_visibility_and_closed.py

      - name: Validate application
        run: |
          npm install
          npm run build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "V83: cap terminal Kanban columns and add Encerrados"
            git push
          fi
