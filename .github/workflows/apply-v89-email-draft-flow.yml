name: Apply V89 Email Draft Flow

on:
  push:
    branches:
      - feature/email-draft-flow-v89
    paths:
      - scripts/apply_v89_email_draft_flow.py
      - .github/workflows/apply-v89-email-draft-flow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/email-draft-flow-v89
          fetch-depth: 0
      - name: Apply V89 patch
        run: python scripts/apply_v89_email_draft_flow.py
      - name: Guardrails
        run: |
          grep -q "set_email_campaign_recipients" src/email-marketing.jsx
          grep -q "Salvar campanha" src/email-marketing.jsx
          grep -q "Iniciar envio" src/email-marketing.jsx
          grep -q "continueDraft" src/email-marketing.jsx
          ! grep -q "Criar campanha e iniciar fila" src/email-marketing.jsx
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate production build
        run: npm run build
      - name: Commit generated V89 UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/email-marketing.jsx src/email-marketing.css
          if ! git diff --cached --quiet; then
            git commit -m "V89: save email campaign before selecting recipients"
            git push origin HEAD:feature/email-draft-flow-v89
          fi
