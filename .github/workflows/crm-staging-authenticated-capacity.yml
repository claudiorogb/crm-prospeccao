name: CRM staging authenticated capacity

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/crm-staging-authenticated-capacity.yml'

permissions:
  contents: read

jobs:
  authenticated-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create isolated staging sessions
        env:
          SESSION_COUNT: '5'
          SESSIONS_FILE: loadtest/.sessions.json
        run: node loadtest/prepare-auth.mjs

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Find current authenticated capacity boundary
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p loadtest/results
          echo 'vus,status' > loadtest/results/stage-status.csv

          run_stage() {
            vus="$1"
            echo "===== RAMPED STAGE ${vus} VUs ====="
            k6 run \
              -e VUS="$vus" \
              -e RAMPED='true' \
              -e RAMP_DURATION='30s' \
              -e HOLD_DURATION='20s' \
              --summary-export="loadtest/results/ramped-${vus}.json" \
              loadtest/k6-authenticated-e2e.js 2>&1 | tee "loadtest/results/ramped-${vus}.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "${vus},pass" >> loadtest/results/stage-status.csv
              return 0
            fi
            echo "${vus},fail" >> loadtest/results/stage-status.csv
            return 1
          }

          last_pass=0
          first_fail=250

          if run_stage 100; then
            last_pass=100
            sleep 5
            if run_stage 150; then
              last_pass=150
              sleep 5
              if run_stage 200; then
                last_pass=200
                sleep 5
                if run_stage 225; then
                  last_pass=225
                else
                  first_fail=225
                fi
              else
                first_fail=200
                sleep 5
                if run_stage 175; then
                  last_pass=175
                else
                  first_fail=175
                fi
              fi
            else
              first_fail=150
              sleep 5
              if run_stage 125; then
                last_pass=125
              else
                first_fail=125
              fi
            fi
          else
            first_fail=100
            sleep 5
            if run_stage 50; then
              last_pass=50
              sleep 5
              if run_stage 75; then
                last_pass=75
              else
                first_fail=75
              fi
            else
              first_fail=50
            fi
          fi

          echo "last_pass=${last_pass}" > loadtest/results/capacity-boundary.txt
          echo "first_fail=${first_fail}" >> loadtest/results/capacity-boundary.txt
          cat loadtest/results/capacity-boundary.txt
          exit 0

      - name: Upload non-sensitive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-staging-capacity-boundary-results
          path: |
            loadtest/auth-summary.json
            loadtest/results/
          if-no-files-found: warn
          retention-days: 3

      - name: Remove ephemeral sessions
        if: always()
        run: rm -f loadtest/.sessions.json
