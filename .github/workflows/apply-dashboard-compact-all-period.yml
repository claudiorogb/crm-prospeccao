name: Apply compact dashboard and all-period filter
on:
  push:
    branches:
      - feature/dashboard-compact-all-period-20260920
    paths:
      - .github/workflows/apply-dashboard-compact-all-period.yml
      - scripts/apply_dashboard_compact_all_period.py
permissions:
  contents: write
concurrency:
  group: dashboard-compact-all-period-20260920
  cancel-in-progress: false
jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard against unrelated changes to the dashboard baseline
        run: |
          test "$(git hash-object src/dashboard-visual.jsx)" = bc80f3ad4886540b021394841b9c1e5b0b1fff83
          test "$(git hash-object src/dashboard-visual.css)" = e637256c6a0fc22fb074b93333d8799308d5b070
      - name: Apply narrow read-only dashboard patch
        run: python scripts/apply_dashboard_compact_all_period.py
      - name: Verify only expected files changed and no security filters were lost
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess
          paths = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert paths == {'src/dashboard-visual.jsx', 'src/dashboard-visual.css'}, paths
          code = Path('src/dashboard-visual.jsx').read_text()
          css = Path('src/dashboard-visual.css').read_text()
          assert code.count(".eq('organization_id', organization.id)") >= 5
          assert code.count('createdAtRange(supabase.from(') == 2
          assert code.count('saleDateRange(supabase.from(') == 1
          assert "if (period === 'all') return [null, null]" in code
          assert 'value="all">Todo o período' in code
          assert "period !== 'all' && (!start || !end || start > end)" in code
          assert "const createdAtRange = query => startTime && endTime" in code
          assert "const saleDateRange = query => start && end" in code
          assert '.axd-root .axd-metric{min-height:0;padding:11px 13px' in css
          print('Period, compact cards, tenant isolation and read-only queries verified.')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Existing regression tests
        run: node --test tests/*.test.mjs
      - name: Production build
        run: npm run build
      - name: Commit tested source changes to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dashboard-visual.jsx src/dashboard-visual.css
          git diff --cached --quiet && exit 0
          git commit -m 'Compact dashboard cards and add Todo o período filter'
          git push origin HEAD:feature/dashboard-compact-all-period-20260920
