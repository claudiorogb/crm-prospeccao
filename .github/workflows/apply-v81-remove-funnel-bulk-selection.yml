name: Apply V81 remove funnel bulk selection

on:
  push:
    paths:
      - 'scripts/apply_v81_remove_funnel_bulk_selection.py'
      - '.github/workflows/apply-v81-remove-funnel-bulk-selection.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V81 patch
        run: python scripts/apply_v81_remove_funnel_bulk_selection.py

      - name: Validate current application
        run: |
          npm install
          npm run build

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "V81: remove bulk selection controls from sales funnel"
            git push
          fi
