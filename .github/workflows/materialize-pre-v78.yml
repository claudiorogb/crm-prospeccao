name: Materialize effective pre-V78 frontend

on:
  push:
    paths:
      - '.github/workflows/materialize-pre-v78.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-effective-pre-v78
          fetch-depth: 0
      - run: npm install
      - run: npm run build
      - name: Commit effective frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "audit: materialize effective pre-V78 frontend"
            git push origin HEAD:audit-effective-pre-v78
          fi
