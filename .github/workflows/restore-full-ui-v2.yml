name: Publish audited CRM interface

on:
  push:
    paths:
      - '.github/workflows/restore-full-ui-v2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch audited restoration
        run: git fetch origin restore-full-ui-v2-2026-09-15

      - name: Publish audited interface only
        run: git checkout origin/restore-full-ui-v2-2026-09-15 -- src/App.jsx src/styles.css

      - name: Guardrails
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/App.jsx').read_text(encoding='utf-8')
          required=[
            'function OverdueReturnsPage','function OverdueReturnsAlert','function OverdueReturnsNavItem',
            'Total de propostas enviadas','Total em Negociação','function TeamPerformance','function SalesPage',
            'function ManualLeadRegistration','Cadastro novo lead','function NotInterestedRepository',
            'function LeadExportPanel','function ResetPasswordScreen','save_lead_journey_checkpoint',
            'AdminCommercialArea','AdminIntegrations','CustomerImportPanel','function ClosedLeads',
            'TERMINAL_VISIBLE_LIMIT = 50','async function loadAllLeads','E-mail marketing','Prospecção vendedor'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+', '.join(missing))
          a=s.index('function Leads({ organization, settings, userEmail }) {')
          b=s.index('\nfunction Clients({ organization, userEmail, userId }) {',a)
          leads=s[a:b]
          forbidden=['Selecionar todos os filtrados','LEADS_PAGE_SIZE','const [page, setPage]']
          bad=[x for x in forbidden if x in leads]
          if bad: raise SystemExit('Forbidden funnel remnants: '+', '.join(bad))
          print('Publish guardrails OK')
          PY

      - name: Validate production build
        run: |
          npm install
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "restore: publish audited complete CRM interface"
            git push origin HEAD:main
          fi
