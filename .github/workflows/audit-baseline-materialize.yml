name: Audit baseline materializer

on:
  push:
    paths:
      - '.github/workflows/audit-baseline-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit baseline branch
        uses: actions/checkout@v4
        with:
          ref: audit-baseline-effective-2026-09-14
          fetch-depth: 0
      - name: Install
        run: npm install
      - name: Materialize historical build patches
        run: npm run build
      - name: Commit effective frontend to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "audit: materialize effective frontend before 2026-09-15"
            git push origin HEAD:audit-baseline-effective-2026-09-14
          fi
