name: CRM staging authenticated capacity

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/crm-staging-authenticated-capacity.yml'

permissions:
  contents: read

jobs:
  authenticated-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create isolated staging sessions
        env:
          SESSION_COUNT: '10'
          SESSIONS_FILE: loadtest/.sessions.json
        run: node loadtest/prepare-auth.mjs

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run ramped 250-user load
        shell: bash
        run: |
          mkdir -p loadtest/results
          k6 run \
            -e VUS='250' \
            -e RAMPED='true' \
            -e RAMP_DURATION='30s' \
            -e HOLD_DURATION='20s' \
            --summary-export='loadtest/results/ramped-250.json' \
            loadtest/k6-authenticated-e2e.js 2>&1 | tee loadtest/results/ramped-250.log

      - name: Upload non-sensitive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-staging-ramped-250-results
          path: |
            loadtest/auth-summary.json
            loadtest/results/
          if-no-files-found: warn
          retention-days: 3

      - name: Remove ephemeral sessions
        if: always()
        run: rm -f loadtest/.sessions.json
