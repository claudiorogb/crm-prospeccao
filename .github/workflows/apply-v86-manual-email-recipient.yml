name: Apply V86 Manual Email Recipient

on:
  push:
    branches:
      - feature/email-marketing-list-v85
    paths:
      - scripts/apply_v86_manual_email_recipient.py
      - .github/workflows/apply-v86-manual-email-recipient.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/email-marketing-list-v85
          fetch-depth: 0

      - name: Apply V86 patch
        run: python scripts/apply_v86_manual_email_recipient.py

      - name: Guardrails
        run: |
          grep -q "Adicionar destinatário manualmente" src/marketing-list-import.jsx
          grep -q "Adicionar e selecionar" src/marketing-list-import.jsx
          grep -q "onManualAdded={handleManualRecipientAdded}" src/email-marketing.jsx
          grep -q "Inserido manualmente" src/marketing-list-import.jsx
          grep -q "email_marketing_contacts" src/marketing-list-import.jsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate production build
        run: npm run build

      - name: Commit generated V86 UI
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/marketing-list-import.jsx src/email-marketing.jsx src/email-marketing.css
          git commit -m "V86: add manual email campaign recipient"
          git push origin HEAD:feature/email-marketing-list-v85
