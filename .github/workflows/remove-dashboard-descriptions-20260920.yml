name: Remove four dashboard descriptions
on:
  push:
    branches:
      - feature/remove-dashboard-descriptions-20260920
    paths:
      - .github/workflows/remove-dashboard-descriptions-20260920.yml
permissions:
  contents: write
jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refuse unexpected source changes
        run: |
          test "$(git hash-object src/App.jsx)" = "e041cb807c0e074dc9cc697a1b3493512d0b3267"
          test "$(git hash-object src/dashboard-visual.jsx)" = "25faf79b32c5dbc74b878a406df365261fd648f6"
      - name: Remove four descriptions only
        run: python3 scripts/remove_dashboard_descriptions_20260920.py
      - name: Check exact source scope
        run: |
          test "$(git diff --name-only | sort)" = "$(printf 'src/App.jsx\nsrc/dashboard-visual.jsx')"
          git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all regression tests
        run: node --test tests/*.test.mjs
      - name: Validate production build
        run: npm run build
      - name: Commit validated UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/dashboard-visual.jsx
          git commit -m "Remove requested dashboard descriptions without changing metrics"
          git push
