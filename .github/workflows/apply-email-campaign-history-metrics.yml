name: Apply provider-neutral email campaign history
on:
  push:
    paths:
      - '.github/workflows/apply-email-campaign-history-metrics.yml'
permissions:
  contents: write
concurrency:
  group: email-campaign-history-metrics
  cancel-in-progress: false
jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow UI patch
        run: python scripts/apply_email_campaign_history_metrics.py
      - name: Verify change scope and reporting semantics
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'src/email-marketing.jsx','src/email-marketing.css'},changed
          ui=Path('src/email-marketing.jsx').read_text()
          component=Path('src/email-campaign-history.jsx').read_text()
          assert "metrics_enabled'" in ui
          assert '<EmailCampaignHistory' in ui
          assert 'email_campaign_recipient_report' in component
          assert 'Não disponível' in component
          assert 'campaign.metrics_enabled' in component
          assert 'onResend(campaign)' in component
          print('Scope, legacy exclusions, tenant-scoped RPC, and existing actions preserved')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Production build
        run: npm run build
      - name: Commit verified UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/email-marketing.jsx src/email-marketing.css
          git diff --cached --quiet && exit 0
          git commit -m 'Show campaign name and creation date with secure on-demand details'
          git push
