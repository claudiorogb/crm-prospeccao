<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0B192C" />
  <title>AXIVA CRM — Sem conexão</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F8FAFC;color:#0B192C;font-family:Inter,Arial,Helvetica,sans-serif}
    main{width:min(420px,100%);text-align:center}
    img{width:96px;height:96px;border-radius:18px}
    h1{font-size:24px;font-weight:700;margin:20px 0 8px}
    p{font-size:16px;line-height:1.55;color:#475569;margin:0 0 22px}
    button{border:0;border-radius:12px;background:#00A88F;color:#0B192C;font:inherit;font-weight:700;padding:13px 22px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/pwa/icon-192.png" alt="AXIVA" width="96" height="96" />
    <h1>Sem conexão</h1>
    <p>O AXIVA CRM precisa de internet para mostrar e salvar seus dados com segurança. Conecte-se e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
