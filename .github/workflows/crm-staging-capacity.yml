name: CRM Staging Capacity Test

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/crm-staging-capacity.yml'

permissions:
  contents: read

jobs:
  capacity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run isolated load test
        id: k6
        continue-on-error: true
        env:
          SUPABASE_URL: https://ovenrdiykmfnjtvqnalz.supabase.co
          SUPABASE_KEY: sb_publishable_Q2F3ab3kHYpI_RZfrhdEfA_49dQEm9G
        run: |
          k6 run --summary-export=loadtest-summary.json loadtest/k6-core.js

      - name: Print capacity summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path = 'loadtest-summary.json'
          if not os.path.exists(path):
              print('CAPACITY_RESULT summary_missing')
              raise SystemExit(0)
          data = json.load(open(path, encoding='utf-8'))
          metrics = data.get('metrics', {})
          stages = ['s10','s25','s50','s100','s200','s350','s500']
          print('CAPACITY_RESULT_BEGIN')
          for s in stages:
              d = metrics.get(f'http_req_duration{{scenario:{s}}}', {}).get('values', {})
              f = metrics.get(f'http_req_failed{{scenario:{s}}}', {}).get('values', {})
              p95 = d.get('p(95)', d.get('p95'))
              avg = d.get('avg')
              rate = f.get('rate')
              print(f'CAPACITY_RESULT {s} avg_ms={avg} p95_ms={p95} fail_rate={rate}')
          overall = metrics.get('http_reqs', {}).get('values', {})
          print(f"CAPACITY_TOTAL requests={overall.get('count')} rate={overall.get('rate')}")
          print('CAPACITY_RESULT_END')
          PY

      - name: Preserve load-test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-staging-capacity-summary
          path: loadtest-summary.json
          if-no-files-found: warn
          retention-days: 1

      - name: Report k6 outcome
        if: always()
        run: echo "k6 outcome=${{ steps.k6.outcome }}"
