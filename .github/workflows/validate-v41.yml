name: Validate CRM V41 build

on:
  push:
    paths:
      - 'scripts/apply_v41_usability_export_sidebar.py'
      - 'package.json'
      - '.github/workflows/validate-v41.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate production build
        run: npm run build
