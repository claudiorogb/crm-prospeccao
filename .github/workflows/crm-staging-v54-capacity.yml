name: CRM staging V54 capacity

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/crm-staging-v54-capacity.yml'

permissions:
  contents: read

jobs:
  v54-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create isolated staging sessions
        env:
          SESSION_COUNT: '5'
          SESSIONS_FILE: loadtest/.sessions-v54.json
        run: node loadtest/prepare-auth-v54.mjs

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Find V54 authenticated capacity boundary
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p loadtest/results-v54
          echo 'vus,status' > loadtest/results-v54/stage-status.csv

          run_stage() {
            vus="$1"
            echo "===== V54 RAMPED STAGE ${vus} VUs ====="
            k6 run \
              -e VUS="$vus" \
              -e RAMP_DURATION='30s' \
              -e HOLD_DURATION='20s' \
              --summary-export="loadtest/results-v54/${vus}.json" \
              loadtest/k6-v54-authenticated.js 2>&1 | tee "loadtest/results-v54/${vus}.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "${vus},pass" >> loadtest/results-v54/stage-status.csv
              return 0
            fi
            echo "${vus},fail" >> loadtest/results-v54/stage-status.csv
            return 1
          }

          last_pass=0
          first_fail=none
          for vus in 150 175 200 225 250 300 350; do
            if run_stage "$vus"; then
              last_pass="$vus"
              sleep 5
            else
              first_fail="$vus"
              break
            fi
          done

          echo "last_pass=${last_pass}" > loadtest/results-v54/capacity-boundary.txt
          echo "first_fail=${first_fail}" >> loadtest/results-v54/capacity-boundary.txt
          cat loadtest/results-v54/capacity-boundary.txt
          exit 0

      - name: Upload non-sensitive V54 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-staging-v54-capacity-results
          path: |
            loadtest/auth-summary-v54.json
            loadtest/results-v54/
          if-no-files-found: warn
          retention-days: 3

      - name: Remove ephemeral sessions
        if: always()
        run: rm -f loadtest/.sessions-v54.json

# Triggered only after staging data and temporary test authorization were validated.
