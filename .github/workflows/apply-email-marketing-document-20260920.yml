name: Apply documented email marketing layout
on:
  push:
    branches:
      - feature/email-marketing-document-layout-20260920
    paths:
      - .github/workflows/apply-email-marketing-document-20260920.yml
      - scripts/apply_email_marketing_document_20260920.py
permissions:
  contents: write
concurrency:
  group: email-marketing-document-20260920
  cancel-in-progress: false
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact pre-change files
        run: |
          test "$(git hash-object src/email-marketing.jsx)" = a8b2fbd3a796a46e66fc8614fdd9c5f97085a5da
          test "$(git hash-object src/marketing-list-import.jsx)" = d3513b67940523f9c5c9ecbb7c029588da85cbdf
          test "$(git hash-object src/newsletter-mailing-panel.jsx)" = f7cc39faceb111fded32ac67554ef101617dbfba
          test "$(git hash-object src/email-marketing.css)" = faadf5769ff5f3c887406a1c19bd36fbaf7c4698
      - name: Apply narrow layout and pagination change
        run: python scripts/apply_email_marketing_document_20260920.py
      - name: Verify changes and safeguards
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          from pathlib import Path
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == {'src/email-marketing.jsx','src/marketing-list-import.jsx','src/newsletter-mailing-panel.jsx','src/email-marketing.css'}, changed
          source = Path('src/email-marketing.jsx').read_text()
          panel = Path('src/newsletter-mailing-panel.jsx').read_text()
          assert source.count(".eq('organization_id', organization.id)") >= 4
          assert "confirm_email_campaign_compliance" in source
          assert "queue_email_campaign" in source
          assert "email_marketing_opt_out" in source
          assert "count: 'exact'" in source and "CAMPAIGN_PAGE_SIZE = 20" in source
          assert panel.index('mode="import"') < panel.index('{open && (')
          assert not any(path.startswith('supabase/') for path in changed)
          print('Scope, organization isolation and sender compliance preserved')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run existing and new regression tests
        run: node --test tests/*.test.mjs
      - name: Build production bundle
        run: npm run build
      - name: Commit verified changes on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/email-marketing.jsx src/marketing-list-import.jsx src/newsletter-mailing-panel.jsx src/email-marketing.css
          git diff --cached --quiet && exit 0
          git commit -m 'Organize email marketing mailing and paginate campaign history'
          git push origin HEAD:feature/email-marketing-document-layout-20260920
