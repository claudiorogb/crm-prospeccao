name: Hotfix funnel blank page

on:
  push:
    paths:
      - '.github/workflows/restore-full-ui-v2.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove stale funnel page dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text(encoding='utf-8')
          old="}, [organization.id, page, filter.search, filter.segment, filter.status])"
          new="}, [organization.id, filter.search, filter.segment, filter.status])"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 stale page dependency, found {count}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Runtime guardrail for Leads
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('src/App.jsx').read_text(encoding='utf-8')
          a=s.index('function Leads({ organization, settings, userEmail }) {')
          b=s.index('\nfunction Clients({ organization, userEmail, userId }) {',a)
          leads=s[a:b]
          forbidden=[
            'organization.id, page, filter.search',
            'LEADS_PAGE_SIZE',
            'const [page, setPage]',
            'goToPage(',
            'loadLeadPage('
          ]
          bad=[x for x in forbidden if x in leads]
          if bad:
              raise SystemExit('Stale pagination references remain in Leads: '+', '.join(bad))
          required=['async function loadAllLeads','TERMINAL_VISIBLE_LIMIT = 50','function ClosedLeads']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Required funnel features missing: '+', '.join(missing))
          print('Funnel runtime guardrails OK')
          PY

      - name: Validate production build
        run: |
          npm install
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "fix: remove stale page reference from funnel runtime"
          git push origin HEAD:main
