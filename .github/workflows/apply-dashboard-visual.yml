name: Validate AXIVA dashboard visual
on:
  push:
    branches:
      - feature/dashboard-visual-20260920
    paths:
      - '.github/workflows/apply-dashboard-visual.yml'
permissions:
  contents: write
concurrency:
  group: dashboard-visual-20260920
  cancel-in-progress: false
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded dashboard replacement
        run: python scripts/apply_dashboard_visual.py
      - name: Check scope and tenant isolation
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed == {'src/App.jsx', 'src/dashboard-visual.jsx'}, changed
          app = Path('src/App.jsx').read_text()
          dash = Path('src/dashboard-visual.jsx').read_text()
          assert app.count('<DashboardVisual organization={organization}') == 1
          assert app.count('<Dashboard\n') >= 2
          assert "eq('organization_id', organization.id)" in dash
          assert dash.count(".eq('organization_id', organization.id)") >= 5
          assert 'service_role' not in dash and '.insert(' not in dash and '.update(' not in dash
          assert 'import' in dash and 'allRows' in dash
          print('Scope, shared component and tenant-scoped read-only queries verified')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Existing regression tests
        run: node --test tests/*.test.mjs
      - name: Production build
        run: npm run build
      - name: Commit validated dashboard on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx src/dashboard-visual.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate shared AXIVA dashboard for admin sandbox and users'
          git push origin HEAD:feature/dashboard-visual-20260920
