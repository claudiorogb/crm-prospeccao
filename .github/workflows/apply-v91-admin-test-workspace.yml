name: Apply V91 isolated Teste workspace

on:
  push:
    paths:
      - 'scripts/apply_v91_admin_test_workspace.py'
      - '.github/workflows/apply-v91-admin-test-workspace.yml'

permissions:
  contents: write

concurrency:
  group: v91-admin-test-workspace
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and apply only the intended App edits
        run: python scripts/apply_v91_admin_test_workspace.py
      - name: Build CRM before publishing
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit validated App changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'V91: isolate Teste admin controls and exclude sandbox from platform dashboard'
            git push
          fi
