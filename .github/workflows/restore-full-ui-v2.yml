name: Controlled full UI restoration V2

on:
  push:
    paths:
      - '.github/workflows/restore-full-ui-v2.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restoration branch
        uses: actions/checkout@v4
        with:
          ref: restore-full-ui-v2-2026-09-15
          fetch-depth: 0

      - name: Apply requested funnel changes to complete UI
        run: python scripts/restore_v81_v83_rich_ui.py

      - name: Validate complete feature set
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/App.jsx').read_text(encoding='utf-8')
          checks = {
            'Retornos atrasados': 'function OverdueReturnsPage',
            'Alerta de atrasados': 'function OverdueReturnsAlert',
            'Dashboard completo': 'Total de propostas enviadas',
            'Equipe': 'function TeamPerformance',
            'Vendas': 'function SalesPage',
            'Origem/conversão': 'get_origin_conversion',
            'Cadastro manual': 'function ManualLeadRegistration',
            'Canal do lead': 'E-mail marketing',
            'Leads sem interesse': 'function NotInterestedRepository',
            'Exportação': 'function LeadExportPanel',
            'Jornada': 'save_lead_journey_checkpoint',
            'Recuperação de senha': 'function ResetPasswordScreen',
            'Área comercial': 'AdminCommercialArea',
            'Integrações': 'AdminIntegrations',
            'Encerrados': 'function ClosedLeads',
            'Regra 50': 'TERMINAL_VISIBLE_LIMIT = 50',
            'Funil contínuo': 'async function loadAllLeads',
          }
          missing=[name for name, marker in checks.items() if marker not in s]
          if missing: raise SystemExit('Missing features: '+', '.join(missing))
          a=s.index('function Leads({ organization, settings, userEmail }) {')
          b=s.index('\nfunction Clients({ organization, userEmail, userId }) {',a)
          leads=s[a:b]
          forbidden=['Selecionar todos os filtrados','LEADS_PAGE_SIZE','const [page, setPage]']
          bad=[x for x in forbidden if x in leads]
          if bad: raise SystemExit('Forbidden funnel remnants: '+', '.join(bad))
          print('Complete feature set OK')
          PY

      - name: Validate production build
        run: |
          npm install
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Commit consolidated restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css scripts/restore_v81_v83_rich_ui.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "restore: full CRM UI with requested funnel changes only"
            git push origin HEAD:restore-full-ui-v2-2026-09-15
          fi
